general: {seed: 34344494}
output:
  root: ./output
  dataset_name: reference_table
  image_width: 960
  image_height: 720
  count: 1
  formats: [coco, yolo]
blender: {binary: null, samples: 32, engine: BLENDER_EEVEE}
assets: {tile_blend: ./assets/blender/tiles_master.blend, mat_blend: ./assets/masters/table_assets.blend}
scene:
  mode: fixed
  background: {enabled: false, path: ./assets/backgrounds, color: [0.025, 0.30, 0.16]}
  camera:
    distance_range: [0.72, 0.72]
    tilt_deg_range: [64, 64]
    yaw_deg_range: [-2, -2]
    roll_deg_range: [0, 0]
    target_x: 0.0
    target_y: 0.0
    target_z: 0.0044
    lens_mm: 48
    dof_enabled: true
    focus_distance: 0.72
    aperture_fstop: 4.5
  lighting: {intensity_range: [1.15, 1.15]}
noise:
  blur_prob: 0.0
  blur_sigma_range: [0.2, 0.2]
  brightness_range: [0.98, 0.98]
  contrast_range: [1.04, 1.04]
  jpeg_quality_range: [92, 92]
