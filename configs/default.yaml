# Inspired by external/photo_sample/34344494_s.jpg (640 x 480).
# Coordinates are metres on the 690 mm square mahjong mat.
general: {seed: 34344494}
output:
  root: ./output
  dataset_name: sample_v001
  image_width: 640
  image_height: 480
  count: 3000
  formats: [coco, yolo]
blender: {binary: null, samples: 32, engine: BLENDER_EEVEE}
assets:
  tile_blend: ./assets/blender/tiles_master.blend
  mat_blend: ./assets/masters/table_assets.blend
scene:
  mode: fixed
  background: {enabled: false, path: ./assets/backgrounds}
  camera:
    distance_range: [0.503, 0.503]
    tilt_deg_range: [55.5, 55.5]
    yaw_deg_range: [0, 0]
    roll_deg_range: [0, 0]
    target_x: 0
    target_y: -0.185
    target_z: 0.005
    lens_mm: 50
    dof_enabled: false
    focus_distance: 0.48
    aperture_fstop: 5.6
  lighting: {intensity_range: [1.3, 1.3]}
noise:
  blur_prob: 0
  brightness_range: [1.12, 1.12]
  contrast_range: [1.0, 1.0]
  jpeg_quality_range: [95, 95]
variations:
  enabled: true
  annotation_groups: [hand]  # Background tiles are visible but excluded from class labels.
  # 5/4 stars change every image. 3 stars change on about 80%, 2 stars on about 50%.
  star3_probability: 0.8
  star2_probability: 0.5
  hand:
    count_options: [13, 14]
    face_up_probability: 0.5  # One posture for the whole hand: flat or upright.
    x_offset_mm_range: [2, 5]
    y_offset_mm_range: [2, 5]
    rotation_z_deg_range: [2, 5]
    spacing_mm_range: [20, 23]  # 14 tiles are capped at 21 mm to remain in frame.
  camera:
    distance_range: [0.48, 0.54]
    tilt_deg_range: [50, 62]
    lens_mm: 40  # Keeps 13/14 tiles inside the 640 px frame across these camera ranges.
    yaw_deg_range: [-4, 4]
    roll_deg_range: [-2, 2]
    target_x_range: [-0.02, 0.02]
    target_y_range: [-0.20, -0.17]
  lighting:
    intensity_range: [1.0, 1.55]
    key_position_ranges: [[-0.48, -0.22], [-0.38, -0.12], [0.68, 0.95]]
    fill_position_ranges: [[0.22, 0.46], [0.08, 0.32], [0.48, 0.72]]
    color_temperature_range: [4000, 6200]
  materials:
    tile_roughness_range: [0.34, 0.48]
    tile_specular_range: [0.30, 0.42]
    felt_tint_ranges: [[0.78, 1.0], [0.92, 1.08], [0.50, 0.80]]
    felt_brightness_range: [0.90, 1.10]
    felt_roughness_range: [0.88, 0.98]
    felt_texture_strength_range: [0.015, 0.045]
  hand_occlusion_probability: 0.01
  noise:
    brightness_range: [0.85, 1.20]
    contrast_range: [0.9, 1.1]
    jpeg_quality_range: [75, 100]
    # 50% eligible x 27% conditional = approximately 14% blurred images.
    blur_conditional_probability: 0.27
    blur_sigma_range: [0.2, 1.0]
  discard_max_removed: 4
  wall_shift_mm_range: [2, 5]
  wall_max_removed: 2
