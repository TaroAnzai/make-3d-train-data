general: {seed: 98765}
output:
  root: ~/3d-train-data
  image_width: 1280
  image_height: 720
  count: 200
  formats: [coco, yolo]
blender: {binary: null, samples: 24, engine: BLENDER_EEVEE}
assets: {tile_blend: ./assets/blender/tiles_master.blend, mat_blend: ./assets/masters/table_assets.blend}
scene:
  mode: random
  background: {enabled: false, path: ./assets/backgrounds}
  camera: {distance_range: [0.42, 0.78], tilt_deg_range: [25, 55], yaw_deg_range: [-45, 45], roll_deg_range: [-15, 15], target_z: 0.0044}
  lighting: {intensity_range: [0.25, 0.75]}
tiles:
  count_range: [16, 30]
  allowed_classes: all
  x_range: [-0.25, 0.25]
  y_range: [-0.20, 0.20]
  z_range: [0.0, 0.008]
  scale_range: [0.65, 1.05]
  rotation_x_range: [-25, 25]
  rotation_y_range: [-25, 25]
  rotation_z_range: [-70, 70]
  overlap_ratio_range: [0.35, 0.70]
  edge_crop_probability: 0.35
  small_tile_probability: 0.55
  small_scale_range: [0.25, 0.55]
  occlusion_enabled: true
noise:
  blur_prob: 0.55
  blur_sigma_range: [0.7, 2.2]
  brightness_range: [0.35, 0.85]
  contrast_range: [0.65, 1.15]
  jpeg_quality_range: [50, 82]
