[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "make-3d-train-data"
version = "0.1.0"
description = "Headless Blender synthetic dataset generator for 37 mahjong tile classes"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
make-3d-train-data = "make_3d_train_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["blender: requires the Blender executable"]

